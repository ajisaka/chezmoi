  CronRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Daily notification mail
      # RoleArn: !GetAtt AnyRule.Arn
      ScheduleExpression: 'cron(0 9 * * ? *)'  # UTC
      State: ENABLED
      Targets:
        - Arn: !Ref FooStateMachine
          RoleArn: !GetAtt CronExecutorRole.Arn
          Id: daily-statemachine
        - Arn: !GetAtt FooFunctions.Arn
          Id: daily-function


  CronExecutorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: start
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: 'states:*'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'lambda:InvokeAsync'
                  - 'lambda:InvokeFunction'
                Resource: !GetAtt FooFunction.Arn
