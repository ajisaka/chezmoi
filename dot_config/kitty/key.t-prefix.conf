# vim:fileencoding=utf-8:ft=conf:foldmethod=marker

# Hints {{{

map ctrl+t>h>h kitten hints --type hash --program @
map ctrl+t>h>l kitten hints --type line --program @
map ctrl+t>h>u kitten hints --type url --program @
map ctrl+t>h>w kitten hints --type word --program @

map ctrl+t>shift+h>h kitten hints --type hash --program -
map ctrl+t>shift+h>l kitten hints --type line --program -
map ctrl+t>shift+h>u kitten hints --type url --program -
map ctrl+t>shift+h>w kitten hints --type word --program -

# }}}

# Tab management {{{

map ctrl+t>p        previous_tab
map ctrl+t>n        next_tab
map ctrl+t>c        new_tab_with_cwd
map ctrl+t>,        set_tab_title

map ctrl+t>1 goto_tab 1
map ctrl+t>2 goto_tab 2
map ctrl+t>3 goto_tab 3
map ctrl+t>4 goto_tab 4
map ctrl+t>5 goto_tab 5
map ctrl+t>6 goto_tab 6
map ctrl+t>7 goto_tab 7
map ctrl+t>8 goto_tab 8
map ctrl+t>9 goto_tab 9
map ctrl+t>0 goto_tab 10

# }}}

# Layout management {{{

# https://sw.kovidgoyal.net/kitty/layouts.html?highlight=mirro#id3

enabled_layouts vertical,grid,fat:full_size=1;bias=50,horizontal,tall,splits,stack

map ctrl+t>l>l next_layout

map ctrl+t>l>f goto_layout fat:full_size=1;bias=50
map ctrl+t>l>g goto_layout grid
map ctrl+t>l>h goto_layout horizontal
map ctrl+t>l>p goto_layout splits
map ctrl+t>l>s goto_layout stack
map ctrl+t>l>t goto_layout tall
map ctrl+t>l>v goto_layout vertical

# }}}

# Marker {{{

map ctrl+t>m>c            create_marker
map ctrl+t>m>r            remove_marker
map ctrl+t>m>p            scroll_to_mark prev
map ctrl+t>m>n            scroll_to_mark next

# }}}

# Misc {{{

map ctrl+t>semicolon      kitty_shell overlay
map ctrl+t>ctrl+t>ctrl+t  clear_terminal reset active
map ctrl+t>s              show_scrollback

# }}}

# Window management {{{

map ctrl+t>q    close_window

map ctrl+t>w>w  new_window_with_cwd
map ctrl+t>w>c  new_window_with_cwd

map ctrl+t>w>s  start_resizing_window

map ctrl+t>w>p previous_window
map ctrl+t>w>n next_window

map ctrl+t>w>1 first_window
map ctrl+t>w>2 second_window
map ctrl+t>w>3 third_window
map ctrl+t>w>4 fourth_window
map ctrl+t>w>5 fifth_window
map ctrl+t>w>6 sixth_window
map ctrl+t>w>7 seventh_window
map ctrl+t>w>8 eighth_window
map ctrl+t>w>9 ninth_window
map ctrl+t>w>0 tenth_window

# }}}

# Clipboard {{{

map ctrl+t>ctrl+c  copy_to_clipboard
map ctrl+t>ctrl+v  paste_from_clipboard

# }}}

